<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arel Focus</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main class="card" role="main">
      <div class="mark" aria-hidden="true">
        <span class="dot"></span>
        <span class="wordmark">Arel Focus</span>
      </div>

      <h1 class="headline">You're focused on <span id="target">your work</span>.</h1>
      <p class="subline">
        <span id="domain">This site</span> is blocked by your
        <span id="profile">focus</span> profile.
      </p>

      <div class="actions">
        <button id="back" class="btn btn-primary" type="button">Back to work</button>
        <button id="allow" class="btn btn-ghost" type="button">
          Allow <span class="allow-domain" id="allow-domain">this site</span> for this session
        </button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>

    <script src="blocked.js"></script>
  </body>
</html>
